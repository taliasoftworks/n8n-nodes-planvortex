name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 20 is NOT here, and not because the package dropped it. What ships has no
        # dependencies and touches no Node API, so it runs wherever n8n runs — n8n 1.x and early
        # 2.x ran on Node 20.19+, which is why `engines` still says >=20. What cannot run on 20 is
        # the DEV toolchain: the `n8n-workflow` peer resolves to 2.40, whose expression runtime
        # pulls `isolated-vm` 7, a native module with prebuilt binaries for Node 24 and 26 only.
        # Anywhere else `npm ci` compiles it from source: that works on 22 and fails on 20, so a
        # Node 20 job was a red CI that said nothing about this package. The day 22 stops
        # compiling it, 22 goes the same way — n8n itself asks for Node 24 since 2.x.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      # The same rules n8n's verification scan applies, so a rejection shows up here first.
      - name: Run lint
        run: 'npm run lint'

      # Vitest runs the tests through esbuild, which strips types without checking them: without
      # this step a test can be wrong about the shape of what it imports and still go green.
      - name: Type-check the sources and the tests
        run: 'npm run typecheck'

      - name: Run tests
        run: 'npm test'

      - name: Run build
        run: 'npm run build'

  scan:
    # n8n's own static analysis of the package, over the two sets of files its scanner lints on a
    # release: the source, and what the tarball will carry (so `npm run scan` builds first).
    #
    # The third thing the scanner checks — the provenance attestation — needs a version on npm to
    # read it from, so it runs after publishing, in `publish.yml` (`npm run scan:published`).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run the n8n community-package scan
        run: 'npm run scan'

  catalogue-in-sync:
    # The error catalogue is generated from `errors/planvortex-errors.json` and both are
    # committed, because CI clones only this repository and the server's catalogue is not here.
    # Regenerating and diffing is what catches the commit that edited one of the two by hand —
    # the generated file says "do not edit" and that is not a mechanism.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Regenerate the error catalogue
        run: 'npm run errors:generate'

      - name: Check it matches what is committed
        run: 'git diff --exit-code nodes/PlanVortex/transport/errors.generated.ts'
