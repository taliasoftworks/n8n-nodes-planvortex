# Publishes n8n-nodes-planvortex to npm when a version tag is pushed, then runs n8n's own scan
# against what was published.
#
# Since 01-05-2026 n8n only verifies community nodes published from GitHub Actions with an npm
# provenance statement: a package published from a laptop can never reach n8n Cloud. This file
# replaces the scaffold's `publish.yml` — same name, because npm's Trusted Publisher is
# configured against it — with what the other PlanVortex packages learnt publishing theirs.
#
# ─── RELEASING ─────────────────────────────────────────────────────────────────
#
# Bump `version` in package.json, add its CHANGELOG entry, commit, then tag THAT commit:
#
#   git tag v0.1.1 && git push origin main v0.1.1
#
# A tag that does not match package.json fails the run instead of publishing nothing in green.
#
# ─── AUTHENTICATION ────────────────────────────────────────────────────────────
#
# Trusted publishing (OIDC): no npm token in the repository secrets. On npmjs.com the publisher
# must read, character by character: owner `taliasoftworks`, repository
# `n8n-nodes-planvortex`, workflow `publish.yml`, no environment. npm compares those strings
# as they are and does not say which one is wrong.
#
# The FIRST publish cannot use it: npm only lets a Trusted Publisher be configured on a package
# that already exists. So version 0.1.0 goes out with a short-lived `NPM_TOKEN` secret — still
# from this workflow, still with provenance — and then the publisher is configured, the token
# revoked and the secret deleted. With the secret gone, the step below does not touch the token.

name: Publish

on:
  push:
    tags: ['v*.*.*']
  # To re-run a publish without moving the tag, when what failed was npm's plumbing and not the
  # code. It publishes the version in package.json on the branch it is run from.
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Signing the provenance AND authenticating, which are two separate things. The signature
      # comes from `id-token: write` and works on its own; the credential comes from an exchange
      # against npm that needs npm >= 11.5.1 and a Trusted Publisher that matches. When it does
      # not match, npm signs the provenance anyway and sends the upload with no credential: the
      # symptom is an `E404` that reads like "the package does not exist" and means "you are not
      # allowed". The first release of `planvortex` burnt three attempts on that, and the cause
      # was one lower-case letter in the repository name on npmjs.com.
      id-token: write
      contents: read

    outputs:
      version: ${{ steps.published.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, and Node 22 ships npm 10.
      - run: npm install -g npm@latest

      # A tag pushed without bumping package.json would find that version already on npm, skip
      # the publish and finish green, having released nothing.
      - name: Does the tag match package.json?
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json, which says $expected. Bump the version, commit, and tag that commit."
            exit 1
          fi

      # A tag can be pushed again — to move it onto the commit that was really published — and
      # then this runs on a version that is already on npm. Without this step that is a red run
      # with an E403 that means nothing; with it the release is idempotent.
      - name: Is this version already on npm?
        id: published
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm: nothing will be published."
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not on npm yet: publishing it."
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Builds, then lints the source and the files the tarball will carry with the same rules
      # n8n's scanner applies. What gets published is the `dist/` this step builds.
      - run: npm run scan

      - name: Is the error catalogue in sync?
        run: git diff --exit-code nodes/PlanVortex/transport/errors.generated.ts

      - name: Publish to npm
        if: steps.published.outputs.already == 'no'
        env:
          # The scaffold's `prepublishOnly` refuses any `npm publish` without it, so that nobody
          # publishes this package from a laptop — which n8n would never verify.
          RELEASE_MODE: 'true'
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is set: publishing with it. It exists for the first publish only — revoke it and delete the secret once the Trusted Publisher is configured."
            npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
          fi
          npm publish --provenance --access public

  verify:
    # n8n's scanner against the version on npm, which is what the Creator Portal runs on a
    # submission: provenance, then the source at the commit the provenance names, then the
    # tarball. A red run here is a rejection seen before sending anything.
    name: Scan the published package
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # npm takes a while to serve a new version, and answers from its cache in the meantime.
      # Scanning in the second after the publish finds a 404 that looks like a scanner failure
      # and is not one — the MCP server's registry job learnt that the same way. Waiting on the
      # provenance field, not just on the version, waits on the exact thing the scan checks first.
      - name: Wait until npm serves the version with its provenance
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          name=$(node -p "require('./package.json').name")
          for attempt in $(seq 1 30); do
            if npm view "$name@$VERSION" dist.attestations.provenance.predicateType --prefer-online 2>/dev/null | grep -q 'slsa.dev/provenance'; then
              echo "npm serves $name@$VERSION with provenance (attempt $attempt)."
              exit 0
            fi
            echo "npm does not serve $name@$VERSION with provenance yet; attempt $attempt of 30."
            sleep 10
          done
          echo "::error::npm did not serve $name@$VERSION with a provenance attestation within five minutes."
          exit 1

      - name: Run n8n's scan on the published package
        run: npm run scan:published -- "${{ needs.publish.outputs.version }}"
